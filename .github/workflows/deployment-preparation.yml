name: Deployment preparation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run test:deployment
      - run: npm run build
      - run: npm audit --omit=dev
      # No secrets, private database import, deploy or production mutation here.
